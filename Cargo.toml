[package]
name = "tree-sitter-super-duper-octo-happiness"
description = "super-duper-octo-happiness grammar for tree-sitter"
version = "0.1.0"
authors = ["Valor <valorjesson@icloud.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "super-duper-octo-happiness"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/valorjesson-commits/super-duper-octo-happiness"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26"
